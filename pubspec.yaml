name: osito_vicuna
description: App satírica creepy-cute - Osito Vicuña
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  url_launcher: ^6.2.4
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_osito.png
    - assets/images/osito_frontal.png
    - assets/images/bg_tela.png
    - assets/images/merch_camiseta.png
    - assets/images/merch_taza.png
    - assets/images/merch_pin.png
    - assets/text/terminos.txt
    - assets/text/privacidad.txt
